name: CI Test

on:
  push:
  pull_request:

jobs:
  test-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install ruff pytest

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Pytest
        run: |
          for dir in practicals/*/; do
            if [ -f "$dir/pyproject.toml" ]; then
              echo "Testing $dir..."
              (cd "$dir" && python -m pytest -v)
            fi
          done
