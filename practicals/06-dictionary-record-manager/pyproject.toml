[project]
name = "dictionary-record-manager"
version = "0.1.0"
description = "In-memory dictionary record manager practical"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["solution"]
testpaths = ["tests"]