name: CI Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install ruff pytest

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Pytest
        run: |
          cd 06-dictionary-record-manager
          python -m pytest -v